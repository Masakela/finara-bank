# Render blueprint — hosts BOTH the database and the site on Render.
# render.com → New → Blueprint → pick this repo → Apply. Render provisions a free
# PostgreSQL instance, wires its connection string into the web service as
# DATABASE_URL, and deploys the app. Schema + demo seed are created on first boot.
databases:
  - name: finara-db
    plan: free
    databaseName: finara
    user: finara

services:
  - type: web
    name: finara
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finara-db
          property: connectionString
      - key: DB_BACKEND
        value: postgres
      - key: NODE_VERSION
        value: "22"
